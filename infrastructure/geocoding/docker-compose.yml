name: esyglob-geocoding

services:
  postgis:
    image: postgis/postgis:16-3.5
    restart: unless-stopped
    shm_size: 2gb
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --encoding=UTF8
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - maintenance_work_mem=2GB
      - -c
      - work_mem=32MB
      - -c
      - checkpoint_timeout=30min
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - random_page_cost=1.0
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-geocoder.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [geocoding]

  nominatim:
    build:
      context: ./nominatim
      args:
        NOMINATIM_VERSION: "5.3.2"
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      NOMINATIM_DATABASE_DSN: ${NOMINATIM_DATABASE_DSN}
      NOMINATIM_API_POOL_SIZE: ${NOMINATIM_API_POOL_SIZE:-10}
      NOMINATIM_IMPORT_STYLE: ${NOMINATIM_IMPORT_STYLE:-address}
      NOMINATIM_SERVE_LEGACY_URLS: "yes"
      NOMINATIM_API_WORKERS: ${NOMINATIM_API_WORKERS:-4}
    working_dir: /srv/nominatim-project
    volumes:
      - nominatim_project:/srv/nominatim-project
      - ./data:/imports:ro
    ports:
      - "${GEOCODER_BIND_IP:-127.0.0.1}:${NOMINATIM_PORT:-8088}:8088"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8088/status"]
      interval: 20s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks: [geocoding]

  photon:
    build:
      context: ./photon
      args:
        PHOTON_VERSION: ${PHOTON_VERSION:-1.2.1}
    restart: unless-stopped
    environment:
      PHOTON_HEAP: ${PHOTON_HEAP:-8g}
    volumes:
      - photon_data:/photon/photon_data
    ports:
      - "${GEOCODER_BIND_IP:-127.0.0.1}:${PHOTON_PORT:-2322}:2322"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:2322/status"]
      interval: 20s
      timeout: 5s
      retries: 20
      start_period: 180s
    networks: [geocoding]

networks:
  geocoding:
    driver: bridge
    internal: true

volumes:
  postgis_data:
  nominatim_project:
  photon_data:
