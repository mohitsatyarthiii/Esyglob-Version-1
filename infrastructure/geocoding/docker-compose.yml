name: ${COMPOSE_PROJECT_NAME:-esyglob-geocoding}

services:
  nominatim:
    image: ${NOMINATIM_IMAGE:?Set NOMINATIM_IMAGE in .env}
    restart: unless-stopped
    shm_size: ${NOMINATIM_SHM_SIZE:-1gb}
    environment:
      PBF_PATH: /data/${OSM_PBF_FILE:?Set OSM_PBF_FILE in .env}
      REPLICATION_URL: ${NOMINATIM_REPLICATION_URL:?Set NOMINATIM_REPLICATION_URL in .env}
      UPDATE_MODE: none
      IMPORT_WIKIPEDIA: "false"
      IMPORT_US_POSTCODES: "false"
      IMPORT_GB_POSTCODES: "false"
      IMPORT_TIGER_ADDRESSES: "false"
      THREADS: ${NOMINATIM_THREADS:-1}
      NOMINATIM_DATABASE_DSN: pgsql:dbname=nominatim;host=/var/run/postgresql
      NOMINATIM_PASSWORD: ${NOMINATIM_PASSWORD:?Set NOMINATIM_PASSWORD in .env}
      POSTGRES_SHARED_BUFFERS: ${POSTGRES_SHARED_BUFFERS:-1GB}
      POSTGRES_MAINTENANCE_WORK_MEM: ${POSTGRES_MAINTENANCE_WORK_MEM:-1GB}
      POSTGRES_AUTOVACUUM_WORK_MEM: ${POSTGRES_AUTOVACUUM_WORK_MEM:-256MB}
      POSTGRES_WORK_MEM: ${POSTGRES_WORK_MEM:-8MB}
      POSTGRES_EFFECTIVE_CACHE_SIZE: ${POSTGRES_EFFECTIVE_CACHE_SIZE:-4GB}
      POSTGRES_MAX_WAL_SIZE: ${POSTGRES_MAX_WAL_SIZE:-2GB}
      POSTGRES_MAX_CONNECTIONS: ${POSTGRES_MAX_CONNECTIONS:-50}
      NOMINATIM_DATABASE_WEBUSER: www-data
      NOMINATIM_API_POOL_SIZE: ${NOMINATIM_API_POOL_SIZE:-2}
    volumes:
      - ./data:/data:ro
      - nominatim_db:/var/lib/postgresql/16/main
      - nominatim_flatnode:/nominatim/flatnode
    networks:
      - internal
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 10 http://127.0.0.1:8080/status >/dev/null || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: ${NOMINATIM_HEALTH_START_PERIOD:-48h}
    mem_limit: ${NOMINATIM_MEMORY_LIMIT:-5g}
    cpus: ${NOMINATIM_CPUS:-1.25}
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  photon:
    image: ${PHOTON_JAVA_IMAGE:?Set PHOTON_JAVA_IMAGE in .env}
    restart: unless-stopped
    init: true
    user: "10002:10002"
    working_dir: /opt/photon
    command:
      - java
      - ${PHOTON_HEAP_MIN:--Xms256m}
      - ${PHOTON_HEAP_MAX:--Xmx1024m}
      - -XX:+ExitOnOutOfMemoryError
      - -jar
      - /opt/photon/photon.jar
      - -listen-ip
      - 0.0.0.0
      - -listen-port
      - "2322"
      - -data-dir
      - /photon/photon_data
    volumes:
      - photon_app:/opt/photon:ro
      - photon_data:/photon
    networks:
      - internal
    expose:
      - "2322"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/2322"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: ${PHOTON_HEALTH_START_PERIOD:-15m}
    mem_limit: ${PHOTON_MEMORY_LIMIT:-1536m}
    cpus: ${PHOTON_CPUS:-0.50}
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  gateway:
    image: ${NGINX_IMAGE:?Set NGINX_IMAGE in .env}
    restart: unless-stopped
    depends_on:
      nominatim:
        condition: service_healthy
      photon:
        condition: service_healthy
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - internal
    ports:
      - "${GEOCODER_BIND_IP:-127.0.0.1}:${NOMINATIM_PORT:-8088}:8088"
      - "${GEOCODER_BIND_IP:-127.0.0.1}:${PHOTON_PORT:-2322}:2322"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 -O /dev/null http://127.0.0.1:8088/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    mem_limit: ${GATEWAY_MEMORY_LIMIT:-128m}
    cpus: ${GATEWAY_CPUS:-0.25}
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d:size=4m,mode=0755
      - /var/cache/nginx:size=32m,mode=0755
      - /var/run:size=4m,mode=0755
      - /tmp:size=16m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  internal:
    driver: bridge
    internal: true

volumes:
  nominatim_db:
  nominatim_flatnode:
  photon_app:
  photon_data:
