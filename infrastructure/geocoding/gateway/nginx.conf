user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/json;
    server_tokens off;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream nominatim_backend {
        zone nominatim_backend 64k;
        server nominatim:8080 resolve;
        keepalive 8;
    }

    upstream photon_backend {
        zone photon_backend 64k;
        server photon:2322 resolve;
        keepalive 8;
    }

    server {
        listen 8088;
        client_max_body_size 1m;

        location = /healthz {
            access_log off;
            return 200 '{"status":"ok"}';
        }

        location / {
            proxy_pass http://nominatim_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
    }

    server {
        listen 2322;
        client_max_body_size 1m;

        location = /healthz {
            access_log off;
            return 200 '{"status":"ok"}';
        }

        location / {
            proxy_pass http://photon_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
    }
}
