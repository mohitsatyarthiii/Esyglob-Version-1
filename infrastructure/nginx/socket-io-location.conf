# Include this location in the existing TLS server block for api.esyglob.in.
# esyglob.com is currently served by Netlify, whose rewrite can proxy polling
# but does not pass the WebSocket upgrade (verified against production).
# Do not create a second server block. Keep proxy_pass aligned with the Node port.
# Remove any Nginx `add_header Access-Control-Allow-*` directives from the API
# server/location: Express owns the credentialed allowlist and must emit exactly
# one Access-Control-Allow-Origin value (never combine the origin with `*`).
location /socket.io/ {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
    proxy_buffering off;
}
